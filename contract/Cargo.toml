[package]
name = "allowance"
version = "0.1.0"
edition = "2021"
description = "An AI agent's spending account on NEAR: it can pay, but only inside the box, and every move is on the record."
license = "MIT"
repository = "https://github.com/NoBanks/allowance"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.29"

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unit-testing"] }
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
